workflows:
  ios-capacitor-wrapper-adhoc:
    name: iOS Capacitor Wrapper (Ad Hoc signed .ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.plantain7502.soybean5714
      vars:
        XCODE_WORKSPACE: "capacitor-wrapper/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        XCODE_CONFIG: "Release"
        BUNDLE_ID: "app.plantain7502.soybean5714"

    cache:
      cache_paths:
        - $HOME/.npm
        - capacitor-wrapper/node_modules
        - capacitor-wrapper/ios/App/Pods
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Tooling versions
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install root dependencies
        script: |
          npm ci || npm install

      - name: Sync branding (writes index.html, manifest, capacitor.config.ts, ios-resources/, web icons)
        script: |
          npm run branding:sync

      - name: Build web SPA for Capacitor
        script: |
          npm run build
          test -f dist/index.html

      - name: Install Capacitor wrapper dependencies
        working_directory: capacitor-wrapper
        script: |
          npm install

      - name: Copy SPA build into Capacitor (dist/)
        working_directory: capacitor-wrapper
        script: |
          npm run cap:copy-web
          test -f dist/index.html

      - name: Add iOS platform (if missing)
        working_directory: capacitor-wrapper
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists, skipping cap add."
          fi

      - name: Capacitor sync iOS
        working_directory: capacitor-wrapper
        script: |
          npx cap sync ios

      - name: Generate AppIcon and splash from branding (icon.png/splash.png)
        working_directory: capacitor-wrapper
        script: |
          set -e
          node ../scripts/sync-branding.mjs
          test -f ios-resources/icon.png  || { echo "Missing ios-resources/icon.png";  exit 1; }
          test -f ios-resources/icon-only.png  || { echo "Missing ios-resources/icon-only.png";  exit 1; }
          test -f ios-resources/ios/icon.png  || { echo "Missing ios-resources/ios/icon.png";  exit 1; }
          test -f ios-resources/notification-icon.png  || { echo "Missing ios-resources/notification-icon.png";  exit 1; }
          test -f ios-resources/splash.png || { echo "Missing ios-resources/splash.png"; exit 1; }
          npx capacitor-assets generate --ios \
            --assetPath ios-resources \
            --iconBackgroundColor "#000000" \
            --splashBackgroundColor "#000000"
          node ../scripts/sync-branding.mjs
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          APP_ICON="$ICON_SET/AppIcon-512@2x.png"
          NOTIFICATION_ICON="ios/App/App/Assets.xcassets/NotificationIcon.imageset/notification-icon.png"
          ls -la "$ICON_SET" | head -30
          test -f "$APP_ICON" || { echo "AppIcon generation failed"; exit 1; }
          test -f "$NOTIFICATION_ICON" || { echo "Notification icon asset missing"; exit 1; }
          test -f "$ICON_SET/Contents.json" || { echo "AppIcon Contents.json missing"; exit 1; }
          node ../scripts/verify-ios-app-icon.mjs \
            ios-resources/icon-only.png \
            "$APP_ICON" \
            "$ICON_SET" \
            ../public

      - name: Re-sync iOS after asset generation
        working_directory: capacitor-wrapper
        script: |
          set -e
          npx cap sync ios
          node ../scripts/sync-branding.mjs
          PLIST="ios/App/App/Info.plist"
          # Modern asset-catalog flow: only CFBundleIconName is required.
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          # Remove legacy keys that would compete with AppIcon.appiconset.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST"
          node ../scripts/verify-ios-app-icon.mjs \
            ios-resources/icon-only.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset \
            ../public
          node ../scripts/verify-ios-icon-uniqueness.mjs \
            ios/App/App/Assets.xcassets \
            "$PLIST"

      - name: Install CocoaPods
        working_directory: capacitor-wrapper/ios/App
        script: |
          pod install --repo-update

      - name: Set bundle id and display name in Xcode project (from branding.config.json)
        script: |
          set -e
          APP_NAME=$(node -e "console.log(require('./branding.config.json').appName)")
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" \
            capacitor-wrapper/ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" \
            capacitor-wrapper/ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" \
            capacitor-wrapper/ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" \
            capacitor-wrapper/ios/App/App/Info.plist || true
          cd capacitor-wrapper/ios/App
          xcode-project use-profiles

      - name: Build signed Ad Hoc .ipa
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "$XCODE_CONFIG" \
            --archive-directory build/ios/archive
          IPA_PATH=$(ls -t build/ios/ipa/*.ipa | head -1)
          test -f "$IPA_PATH" || { echo "IPA not found"; exit 1; }
          mv "$IPA_PATH" build/ios/ipa/hotmart2.ipa
          test -f build/ios/ipa/hotmart2.ipa

    artifacts:
      - build/ios/ipa/hotmart2.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
