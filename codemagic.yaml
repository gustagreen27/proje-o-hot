workflows:
  ios-capacitor-wrapper-unsigned:
    name: iOS Capacitor Wrapper (unsigned .ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      vars:
        XCODE_WORKSPACE: "capacitor-wrapper/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        XCODE_CONFIG: "Release"

    cache:
      cache_paths:
        - $HOME/.npm
        - capacitor-wrapper/node_modules
        - capacitor-wrapper/ios/App/Pods
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Tooling versions
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install root dependencies
        script: |
          npm ci || npm install

      - name: Install Capacitor wrapper dependencies
        working_directory: capacitor-wrapper
        script: |
          npm install

      - name: Add iOS platform (if missing)
        working_directory: capacitor-wrapper
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists, skipping cap add."
          fi

      - name: Capacitor sync iOS
        working_directory: capacitor-wrapper
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        working_directory: capacitor-wrapper/ios/App
        script: |
          pod install --repo-update

      - name: Build iOS app WITHOUT code signing
        script: |
          set -e
          mkdir -p build/ios/archive build/ios/ipa

          # Archive sem nenhum tipo de assinatura
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIG" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "build/ios/archive/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned .ipa (compatível com ESign)
        script: |
          set -e
          ARCHIVE="build/ios/archive/App.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "App.app não encontrado em $APP_PATH"
            ls -la "$ARCHIVE/Products/Applications/" || true
            exit 1
          fi

          # Empacota App.app -> Payload/ -> .ipa (formato padrão IPA unsigned)
          rm -rf build/ios/ipa Payload
          mkdir -p Payload build/ios/ipa
          cp -R "$APP_PATH" Payload/
          zip -qr "build/ios/ipa/App-unsigned.ipa" Payload
          rm -rf Payload

          echo "IPA gerado:"
          ls -lh build/ios/ipa/

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
