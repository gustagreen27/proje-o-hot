workflows:
  ios-capacitor-wrapper-adhoc:
    name: iOS Capacitor Wrapper (Ad Hoc signed .ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.plantain7502.soybean5714
      vars:
        XCODE_WORKSPACE: "capacitor-wrapper/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        XCODE_CONFIG: "Release"
        BUNDLE_ID: "app.plantain7502.soybean5714"

    cache:
      cache_paths:
        - $HOME/.npm
        - capacitor-wrapper/node_modules
        - capacitor-wrapper/ios/App/Pods
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Tooling versions
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install root dependencies
        script: |
          npm ci || npm install

      - name: Install Pillow (Python imaging — required for favicon/icon-192/icon-512 regen)
        script: |
          python3 -m pip install --user --upgrade Pillow \
            || pip3 install --user --upgrade Pillow \
            || sudo pip3 install Pillow
          python3 -c "from PIL import Image; print('Pillow', Image.__version__, 'OK')"

      - name: Sync branding (writes index.html, manifest, capacitor.config.ts, ios-resources/, web icons)
        script: |
          npm run branding:sync

      - name: Build web SPA for Capacitor
        script: |
          npm run build
          test -f dist/index.html

      - name: Install Capacitor wrapper dependencies
        working_directory: capacitor-wrapper
        script: |
          npm install

      - name: Copy SPA build into Capacitor (dist/)
        working_directory: capacitor-wrapper
        script: |
          npm run cap:copy-web
          test -f dist/index.html

      - name: Add iOS platform (if missing)
        working_directory: capacitor-wrapper
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists, skipping cap add."
          fi

      - name: Capacitor sync iOS
        working_directory: capacitor-wrapper
        script: |
          npx cap sync ios

      - name: Generate AppIcon and splash from branding (icon.png/splash.png)
        working_directory: capacitor-wrapper
        script: |
          set -e
          node ../scripts/sync-branding.mjs
          test -f ios-resources/icon.png  || { echo "Missing ios-resources/icon.png";  exit 1; }
          test -f ios-resources/icon-only.png  || { echo "Missing ios-resources/icon-only.png";  exit 1; }
          test -f ios-resources/ios/icon.png  || { echo "Missing ios-resources/ios/icon.png";  exit 1; }
          test -f ios-resources/notification-icon.png  || { echo "Missing ios-resources/notification-icon.png";  exit 1; }
          test -f ios-resources/splash.png || { echo "Missing ios-resources/splash.png"; exit 1; }
          npx capacitor-assets generate --ios \
            --assetPath ios-resources \
            --iconBackgroundColor "#000000" \
            --splashBackgroundColor "#000000"
          node ../scripts/sync-branding.mjs
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          APP_ICON="$ICON_SET/AppIcon-512@2x.png"
          NOTIFICATION_ICON="ios/App/App/Assets.xcassets/NotificationIcon.imageset/notification-icon.png"
          ls -la "$ICON_SET" | head -30
          test -f "$APP_ICON" || { echo "AppIcon generation failed"; exit 1; }
          test -f "$NOTIFICATION_ICON" || { echo "Notification icon asset missing"; exit 1; }
          test -f "$ICON_SET/Contents.json" || { echo "AppIcon Contents.json missing"; exit 1; }
          node ../scripts/verify-ios-app-icon.mjs \
            ios-resources/icon-only.png \
            "$APP_ICON" \
            "$ICON_SET" \
            ../public

      - name: Snapshot AppIcon and patch Info.plist (NO cap sync after this point)
        working_directory: capacitor-wrapper
        script: |
          set -e
          # CRITICAL: do NOT run `npx cap sync ios` here. cap sync rewrites
          # ios/App/App/Assets.xcassets and would restore the template AppIcon,
          # silently overwriting the freshly generated brand icon.
          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          NOTIF_SET="ios/App/App/Assets.xcassets/NotificationIcon.imageset"
          test -d "$ICON_SET" || { echo "❌ AppIcon.appiconset missing before snapshot"; exit 1; }
          # Snapshot the freshly-generated icon set so we can restore it if any
          # later step (pods, profiles, xcode build prep) touches xcassets.
          SNAP_DIR="/tmp/appicon-snapshot"
          rm -rf "$SNAP_DIR"
          mkdir -p "$SNAP_DIR"
          cp -R "$ICON_SET" "$SNAP_DIR/AppIcon.appiconset"
          [ -d "$NOTIF_SET" ] && cp -R "$NOTIF_SET" "$SNAP_DIR/NotificationIcon.imageset" || true
          echo "📸 Snapshotted AppIcon.appiconset to $SNAP_DIR"
          shasum -a 256 "$ICON_SET"/*.png | tee /tmp/appicon-snapshot.sha256
          node ../scripts/sync-branding.mjs
          PLIST="ios/App/App/Info.plist"
          # Modern asset-catalog flow: only CFBundleIconName is required.
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          # Remove legacy keys that would compete with AppIcon.appiconset.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST"
          node ../scripts/verify-ios-app-icon.mjs \
            ios-resources/icon-only.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png \
            ios/App/App/Assets.xcassets/AppIcon.appiconset \
            ../public
          node ../scripts/verify-ios-icon-uniqueness.mjs \
            ios/App/App/Assets.xcassets \
            "$PLIST"

      - name: Install CocoaPods
        working_directory: capacitor-wrapper/ios/App
        script: |
          pod install --repo-update

      - name: Set bundle id and display name in Xcode project (from branding.config.json)
        script: |
          set -e
          APP_NAME=$(node -e "console.log(require('./branding.config.json').appName)")
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" \
            capacitor-wrapper/ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $APP_NAME" \
            capacitor-wrapper/ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string $APP_NAME" \
            capacitor-wrapper/ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName $APP_NAME" \
            capacitor-wrapper/ios/App/App/Info.plist || true
          # Auto-bump CFBundleVersion (timestamp) so each IPA is unmistakably new on-device.
          BUILD_NUMBER="${BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" \
            capacitor-wrapper/ios/App/App/Info.plist \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" \
            capacitor-wrapper/ios/App/App/Info.plist
          echo "📦 CFBundleVersion=$BUILD_NUMBER"
          cd capacitor-wrapper/ios/App
          xcode-project use-profiles

      - name: 🔒 Final icon lock (LAST step before build — bulletproof)
        script: |
          set -e
          PLIST="capacitor-wrapper/ios/App/App/Info.plist"
          ICON_SET="capacitor-wrapper/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          NOTIF_SET="capacitor-wrapper/ios/App/App/Assets.xcassets/NotificationIcon.imageset"
          SNAP_DIR="/tmp/appicon-snapshot"

          # ----- AppIcon restore guard -----
          # If anything between asset generation and now (pods, profiles, hooks)
          # touched AppIcon.appiconset, restore it from the snapshot taken
          # right after branding generation. cap sync is the usual culprit and
          # has been removed from the pipeline above, but this guard catches
          # any other tool that mutates xcassets.
          if [ -d "$SNAP_DIR/AppIcon.appiconset" ]; then
            CHANGED=0
            if [ ! -d "$ICON_SET" ]; then
              CHANGED=1
            else
              CUR_HASH=$(shasum -a 256 "$ICON_SET"/*.png 2>/dev/null | shasum -a 256 | awk '{print $1}')
              SNAP_HASH=$(shasum -a 256 "$SNAP_DIR/AppIcon.appiconset"/*.png 2>/dev/null | shasum -a 256 | awk '{print $1}')
              [ "$CUR_HASH" = "$SNAP_HASH" ] || CHANGED=1
            fi
            if [ "$CHANGED" = "1" ]; then
              echo "⚠️  AppIcon.appiconset was mutated after branding — restoring from snapshot."
              rm -rf "$ICON_SET"
              cp -R "$SNAP_DIR/AppIcon.appiconset" "$ICON_SET"
              if [ -d "$SNAP_DIR/NotificationIcon.imageset" ]; then
                rm -rf "$NOTIF_SET"
                cp -R "$SNAP_DIR/NotificationIcon.imageset" "$NOTIF_SET"
              fi
            else
              echo "✅ AppIcon.appiconset matches snapshot — no restore needed."
            fi
          else
            echo "⚠️  No AppIcon snapshot found — skipping restore guard."
          fi

          echo "===== INFO.PLIST BEFORE LOCK ====="
          HASH_BEFORE=$(md5 -q "$PLIST" 2>/dev/null || md5sum "$PLIST" | awk '{print $1}')
          echo "md5(before)=$HASH_BEFORE"
          plutil -p "$PLIST" | grep -i CFBundleIcon || true

          echo "🔒 Locking CFBundleIconName = AppIcon ..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName AppIcon" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string AppIcon" "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFiles" "$PLIST" 2>/dev/null || true

          plutil -lint "$PLIST"

          echo "===== INFO.PLIST AFTER LOCK ====="
          HASH_AFTER=$(md5 -q "$PLIST" 2>/dev/null || md5sum "$PLIST" | awk '{print $1}')
          echo "md5(after)=$HASH_AFTER"
          plutil -p "$PLIST" | grep -i CFBundleIcon || true

          FINAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST" 2>/dev/null || echo "")
          if [ "$FINAL" != "AppIcon" ]; then
            echo "❌ CFBundleIconName WAS OVERWRITTEN (got: '$FINAL')"
            exit 1
          fi

          # Snapshot hash so the build step can detect any later mutation.
          echo "$HASH_AFTER" > /tmp/info_plist.lock.md5
          echo "✅ ICON LOCK OK — CFBundleIconName=AppIcon (md5=$HASH_AFTER)"

      - name: Build signed Ad Hoc .ipa
        script: |
          set -e
          PLIST="capacitor-wrapper/ios/App/App/Info.plist"
          # Tamper-check: ensure no step between the icon lock and the build mutated Info.plist.
          if [ -f /tmp/info_plist.lock.md5 ]; then
            EXPECTED=$(cat /tmp/info_plist.lock.md5)
            CURRENT=$(md5 -q "$PLIST" 2>/dev/null || md5sum "$PLIST" | awk '{print $1}')
            if [ "$EXPECTED" != "$CURRENT" ]; then
              echo "❌ Info.plist was mutated AFTER the icon lock (expected=$EXPECTED, got=$CURRENT)"
              plutil -p "$PLIST" | grep -i CFBundleIcon || true
              exit 1
            fi
            FINAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$PLIST" 2>/dev/null || echo "")
            [ "$FINAL" = "AppIcon" ] || { echo "❌ CFBundleIconName drifted to '$FINAL'"; exit 1; }
            echo "✅ Info.plist unchanged since icon lock (md5=$CURRENT)"
          fi
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "$XCODE_CONFIG" \
            --archive-directory build/ios/archive
          IPA_PATH=$(ls -t build/ios/ipa/*.ipa | head -1)
          test -f "$IPA_PATH" || { echo "IPA not found"; exit 1; }
          mv "$IPA_PATH" build/ios/ipa/hotmart2.ipa
          test -f build/ios/ipa/hotmart2.ipa

    artifacts:
      - build/ios/ipa/hotmart2.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
