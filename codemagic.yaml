workflows:
  ios-capacitor-wrapper:
    name: iOS Capacitor Wrapper (.ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      vars:
        # Bundle ID precisa bater com capacitor-wrapper/capacitor.config.ts
        BUNDLE_ID: "app.lovable.vendas.ioswrapper"
        XCODE_WORKSPACE: "capacitor-wrapper/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      # Para builds assinados, configure no Codemagic UI:
      #   Teams → Code signing identities → iOS certificate (.p12) + Provisioning profile
      # e ative o bloco abaixo (descomente):
      # ios_signing:
      #   distribution_type: ad_hoc        # ou app_store / development
      #   bundle_identifier: $BUNDLE_ID

    cache:
      cache_paths:
        - $HOME/.npm
        - capacitor-wrapper/node_modules
        - capacitor-wrapper/ios/App/Pods
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Node & tooling versions
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install root dependencies (TanStack Start project)
        script: |
          npm ci || npm install

      - name: Install Capacitor wrapper dependencies
        working_directory: capacitor-wrapper
        script: |
          npm install

      - name: Add iOS platform (if missing)
        working_directory: capacitor-wrapper
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists, skipping cap add."
          fi

      - name: Capacitor sync iOS
        working_directory: capacitor-wrapper
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        working_directory: capacitor-wrapper/ios/App
        script: |
          pod install --repo-update

      - name: Set up code signing (automatic via Codemagic)
        script: |
          # Requer ios_signing configurado acima OU integração App Store Connect API.
          # Sem isso, o archive abaixo cai em "unsigned" e o export .ipa falha.
          xcode-project use-profiles || echo "Skipping: nenhum perfil configurado (build sairá sem assinatura)."

      - name: Build & archive
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM.zip

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
      # Para subir direto no TestFlight, configure App Store Connect API key
      # em Codemagic → Teams → Integrations e descomente:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
