workflows:
  ios-capacitor-wrapper-adhoc:
    name: iOS Capacitor Wrapper (Ad Hoc signed .ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      node: 20
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.plantain7502.soybean5714
      vars:
        XCODE_WORKSPACE: "capacitor-wrapper/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        XCODE_CONFIG: "Release"
        BUNDLE_ID: "app.plantain7502.soybean5714"

    cache:
      cache_paths:
        - $HOME/.npm
        - capacitor-wrapper/node_modules
        - capacitor-wrapper/ios/App/Pods
        - $HOME/Library/Caches/CocoaPods

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Tooling versions
        script: |
          node -v
          npm -v
          xcodebuild -version
          pod --version

      - name: Install root dependencies
        script: |
          npm ci || npm install

      - name: Install Capacitor wrapper dependencies
        working_directory: capacitor-wrapper
        script: |
          npm install

      - name: Add iOS platform (if missing)
        working_directory: capacitor-wrapper
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists, skipping cap add."
          fi

      - name: Capacitor sync iOS
        working_directory: capacitor-wrapper
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        working_directory: capacitor-wrapper/ios/App
        script: |
          pod install --repo-update

      - name: Set bundle id in Xcode project
        script: |
          set -e
          # Garante que o bundle id do projeto Xcode bate com o do provisioning profile
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" \
            capacitor-wrapper/ios/App/App/Info.plist || true
          cd capacitor-wrapper/ios/App
          xcode-project use-profiles

      - name: Build signed Ad Hoc .ipa
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config "$XCODE_CONFIG" \
            --archive-directory build/ios/archive

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
